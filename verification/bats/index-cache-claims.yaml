version: terrorbat/v1

id: index-cache-claims

claim:
  text: >
    At the pinned repository commit, every claim case of the Agent 3
    index/cache adversarial probe holds: verification/probes/
    index_cache_adversarial.py exits 0 (its documented exits are 0 = no claim
    falsified, 1 = at least one claim falsified, 2 = harness error which does
    not speak to the claim).

requires:
  - fs.read
  - process.spawn
  - git.inspect

forbids:
  - network
  - git.remote.write

environment:
  relevant:
    - os.name
    - os.arch

attack:
  setup:
    - adapter: git
      action: worktree.snapshot
  run:
    - adapter: command
      action: run
      program:
        $param: python_program
      args:
        - {$param: probe_script}
        - .

oracle:
  any:
    - type: exit_code
      step: run:0
      equals: 1

evidence:
  capture:
    - stdout
    - stderr
    - git_diff
    - operation_log

timeout:
  run: 300s
  total: 420s

params:
  python_program:
    type: string
    default: C:\Users\Matmus\AppData\Local\Python\pythoncore-3.15-64\python.exe
  probe_script:
    type: string
    default: D:\Projects\pepin\_build\bootstrap-agent3-verification\verification\probes\index_cache_adversarial.py

meta:
  origin: ai-proposed
  author: agent3
  tags: [pepin, index, cache, provenance, agent3]
  description: >
    Prepared adversarial gate for A1's proposed node-ID index/caching
    (Lucy advisory LUCY-20261102-006): stale revisions, invalid references,
    duplicate child edges, cache reuse and diagnostic preservation. At
    05add76 two claim cases are falsified today (duplicate child edge
    accepted; crossed rev1-args/rev2-target invoke accepted with a 0-node
    report labelled rev2), so the run is PROVEN there; at A1's repair SHA
    the same spec must yield NOT OBSERVED. Exit 2 (harness error) does not
    fire the oracle. Worktree mode is reversibility/observation, not
    containment.
