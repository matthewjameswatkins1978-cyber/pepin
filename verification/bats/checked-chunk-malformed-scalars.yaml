version: terrorbat/v1

id: checked-chunk-malformed-scalars

claim:
  text: >
    At the pinned repository commit, the pep-checked-chunk-v1 checked-chunk
    validator fails closed on every malformed transport-scalar input in the
    Agent 3 probe: each of the 11 claim cases (float, bool or text scalars in
    Int positions, a negative child index, string coverage ids and string
    supplied signatures) is refused with a stable ContractRefusal code, so the
    probe exits 0 and reports claim_falsified=0.

requires:
  - fs.read
  - process.spawn
  - git.inspect

forbids:
  - network
  - git.remote.write

environment:
  relevant:
    - os.name
    - os.arch

attack:
  setup:
    - adapter: git
      action: worktree.snapshot
  run:
    - adapter: command
      action: run
      program:
        $param: python_program
      args:
        - {$param: probe_script}
        - .

oracle:
  any:
    - type: exit_code
      step: run:0
      equals: 1

evidence:
  capture:
    - stdout
    - stderr
    - git_diff
    - operation_log

timeout:
  run: 300s
  total: 420s

params:
  python_program:
    type: string
    default: C:\Users\Matmus\AppData\Local\Python\pythoncore-3.15-64\python.exe
  probe_script:
    type: string
    default: D:\Projects\pepin\_build\bootstrap-agent3-verification\verification\probes\hostile_chunk_scalar_types.py

meta:
  origin: ai-proposed
  author: agent3
  tags: [pepin, checked-chunk, malformed-input, agent3]
  description: >
    Agent 3 falsification bat for the A1-owned pep-checked-chunk-v1 boundary.
    Runs verification/probes/hostile_chunk_scalar_types.py inside a disposable
    worktree of the target repository. The probe exits 1 when at least one of
    its 11 claim cases is not refused with a ContractRefusal code, which is
    exactly when this oracle fires. A non-firing oracle is NOT OBSERVED, never
    a correctness certificate. Worktree mode is reversibility/observation, not
    containment.
